name: Create draft release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Package version without the v prefix"
        required: true
        type: string
      target_ref:
        description: "Commit or branch containing the prepared Changelog"
        required: true
        default: main
        type: string
      prerelease:
        description: "Mark the draft as a prerelease"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: draft-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  create-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the release target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Validate prepared release notes
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/changelog.mjs check
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const requested = process.env.RELEASE_VERSION ?? "";
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:\.[0-9A-Za-z]+)*)?$/.test(requested)) process.exit(1);
            const root = JSON.parse(await readFile("package.json", "utf8"));
            const desktop = JSON.parse(await readFile("apps/desktop/package.json", "utf8"));
            if (root.version !== requested || desktop.version !== requested) process.exit(1);
          '
          test -f "changelog/releases/${RELEASE_VERSION}.md"

      - name: Create a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          TARGET_REF: ${{ inputs.target_ref }}
          PRERELEASE: ${{ inputs.prerelease }}
        shell: bash
        run: |
          tag="v${RELEASE_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to rewrite it." >&2
            exit 1
          fi
          args=(release create "$tag" --target "$TARGET_REF" --title "Agent Fabric ${RELEASE_VERSION}" --notes-file "changelog/releases/${RELEASE_VERSION}.md" --draft)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh "${args[@]}"
